<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="ระบบจัดการสอนอัลกุรอาน โรงเรียนบาเจาะ">
  <title>กีรออาตี | โรงเรียนบาเจาะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ==================== LOGIN PAGE ==================== -->
  <div id="loginPage" class="login-page">
    <div class="login-card animate-slide">
      <div class="login-logo" lang="ar">ق</div>
      <h1>กีรออาตี</h1>
      <p class="subtitle">ระบบจัดการสอนอัลกุรอาน โรงเรียนบาเจาะ</p>
      <p class="arabic-greeting" lang="ar" dir="rtl">&#1575;&#1604;&#1587;&#1604;&#1575;&#1605; &#1593;&#1604;&#1610;&#1603;&#1605;</p>
      <div id="loginError" class="hidden" style="background:#fde8e4;color:#b83c24;padding:10px;border-radius:8px;font-size:.85rem;margin-bottom:16px"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>รหัสครู</label>
          <input type="text" class="form-control" id="loginUsername" placeholder="รหัสครู หรือ Admin" required>
        </div>
        <div class="form-group">
          <label>รหัสผ่าน</label>
          <div style="position:relative">
            <input type="password" class="form-control" id="loginPassword" placeholder="กรอกรหัสผ่าน" required style="padding-right:40px">
            <button type="button" id="togglePassword" onclick="var p=document.getElementById('loginPassword');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'แสดง':'ซ่อน';" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;padding:4px">แสดง</button>
          </div>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg mt-2">เข้าสู่ระบบ</button>
      </form>
      <p class="text-sm text-muted mt-2 text-center">ระบบจัดการสอนอัลกุรอาน</p>
    </div>
  </div>

  <!-- ==================== APP LAYOUT ==================== -->
  <div id="appLayout" class="app-layout hidden">
    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" lang="ar">ق</div>
        <div>
          <strong>กีรออาตี</strong>
          <span>โรงเรียนบาเจาะ</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">หลัก</div>
          <a href="#" class="sidebar-link active" data-view="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            แดชบอร์ด
          </a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">การสอน</div>
          <a href="#" class="sidebar-link teacher-only" data-view="classroom">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            ห้องเรียน
          </a>
          <a href="#" class="sidebar-link teacher-only" data-view="monthly">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            รายงานรายเดือน
          </a>
          <a href="#" class="sidebar-link teacher-only" data-view="evaluation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
            การประเมิน
          </a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">รายงาน</div>
          <a href="#" class="sidebar-link" data-view="studentDetail">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            รายงานนักเรียน
          </a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">จัดการ</div>
          <a href="#" class="sidebar-link" data-view="students">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            นักเรียน
          </a>
          <a href="#" class="sidebar-link" data-view="teachers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ครู
          </a>
          <a href="#" class="sidebar-link" data-view="classes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            ห้องเรียน
          </a>
          <a href="#" class="sidebar-link" data-view="notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            แจ้งเตือน
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar user-avatar">A</div>
        <div class="user-info">
          <strong class="user-display-name">ผู้ดูแล</strong>
          <span class="user-display-role">Administrator</span>
        </div>
        <button class="logout-btn" style="margin-left:auto;color:rgba(255,255,255,.4)" title="ออกจากระบบ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <div class="flex items-center gap-2">
          <button id="menuToggle" class="menu-toggle no-print">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 id="pageTitle" style="font-size:1.1rem;margin:0">แดชบอร์ด</h1>
        </div>
        <div class="header-actions">
          <button class="profile-btn no-print" onclick="App.logout()">
            <span class="avatar user-avatar" style="width:28px;height:28px;font-size:12px">A</span>
            <span class="user-display-name">ผู้ดูแล</span>
          </button>
        </div>
      </header>

      <div id="contentArea" class="content-area">
        <!-- Views rendered here by JavaScript -->
        <div class="text-center mt-3"><span class="spinner"></span></div>
      </div>
    </main>
  </div>

  <!-- ==================== MODAL ==================== -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Modal Title</h3>
        <button class="modal-close" onclick="App.closeModal()">&times;</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- ==================== TOAST CONTAINER ==================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js?v=20260821"></script>
  <script src="js/app.js?v=20260821"></script>
  <script>
  (function(){
    var form = document.getElementById('loginForm');
    if(!form) return;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var u = document.getElementById('loginUsername').value.trim();
      var p = document.getElementById('loginPassword').value;
      var err = document.getElementById('loginError');
      var btn = document.getElementById('loginBtn');
      err.classList.add('hidden');
      if(!u||!p){err.textContent='กรุณากรอกรหัสและรหัสผ่าน';err.classList.remove('hidden');return;}
      if(u==='Admin'&&p==='1122'){
        localStorage.setItem('qiroati_user',JSON.stringify({id:'admin',teacherId:'Admin',username:'Admin',name:'ผู้ดูแลระบบ',role:'admin',classId:'',className:''}));
        if(typeof App!=='undefined'){App.showApp();App.navigateTo('dashboard');}
        else{document.getElementById('loginPage').classList.add('hidden');document.getElementById('appLayout').classList.remove('hidden');}
        return;
      }
      var teachers=[];
      try{teachers=JSON.parse(localStorage.getItem('qiroati_teachers')||'[]');}catch(e){}
      var found=null;
      teachers.forEach(function(t){if(t.teacherId===u&&t.password===p&&t.status==='active')found=t;});
      if(found){
        localStorage.setItem('qiroati_user',JSON.stringify({id:found.teacherId,teacherId:found.teacherId,username:found.teacherId,name:found.name,role:'teacher',classId:'',className:''}));
        if(typeof App!=='undefined'){App.showApp();App.navigateTo('dashboard');}
        else{document.getElementById('loginPage').classList.add('hidden');document.getElementById('appLayout').classList.remove('hidden');}
        return;
      }
      err.textContent='รหัสไม่ถูกต้อง';err.classList.remove('hidden');
    });
  })();
  </script>
</body>
</html>
